<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>スマホ対応テスト・テイク2</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style>
        /* iPhoneのSafari対策：高さを動的に計算 */
        html, body {
            height: 100%;
            height: -webkit-fill-available;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
        }

        #game-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        #boot-screen, #orientation-warning {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #222; color: #fff;
            display: flex; justify-content: center; align-items: center;
            z-index: 100; flex-direction: column;
        }

        #start-btn {
            padding: 20px 40px; font-size: 20px; background: #ff4757;
            color: white; border: none; border-radius: 30px; cursor: pointer;
        }

        @media screen and (orientation: portrait) {
            #orientation-warning { display: flex; z-index: 200; }
        }
        @media screen and (orientation: landscape) {
            #orientation-warning { display: none; }
        }
    </style>
</head>
<body>

    <div id="orientation-warning"><h2>📱 画面を横にしてね！</h2></div>

    <div id="boot-screen">
        <button id="start-btn">スタート (ぜんがめん)</button>
    </div>

    <div id="game-container"></div>

    <script>
        const config = {
            type: Phaser.AUTO,
            parent: 'game-container',
            scale: {
                mode: Phaser.Scale.FIT, // 比率を維持して収める
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 1280,
                height: 720
            },
            scene: { create }
        };

        let game;
        document.getElementById('start-btn').addEventListener('click', function() {
            // フルスクリーン化の処理（iPhoneでは効かない場合が多いが、バーを隠すきっかけになる）
            const el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen();
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

            document.getElementById('boot-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            game = new Phaser.Game(config);
        });

        function create() {
            const { width, height } = this.scale;
            this.add.rectangle(0, 0, width, height, 0x333333).setOrigin(0);

            this.add.text(width / 2, height / 2, 'テスト2: 下まで見えますか？', { fontSize: '40px' }).setOrigin(0.5);

            // 四隅に「少し内側」に丸を配置（端から100pxの位置）
            // これが4つとも見えれば、ゲーム画面は100%収まっています
            this.add.circle(100, 100, 40, 0xff0000); // 左上
            this.add.circle(width - 100, 100, 40, 0xff0000); // 右上
            this.add.circle(100, height - 100, 40, 0x00ffff); // 左下 (水色)
            this.add.circle(width - 100, height - 100, 40, 0x00ffff); // 右下 (水色)
        }
    </script>
</body>
</html>
