async function updateRankList(scene, mode, container) {
    // --- お掃除処理（ここを強化しました） ---
    // タイトルと「メニューにもどる」ボタン、モード切替ボタン以外をすべて消す
    const itemsToKeep = 2 + Object.keys(MODES).length; // 残しておきたいパーツの数
    
    // コンテナの中身を逆からチェックして、古いランキング表示を削除
    for (let i = container.list.length - 1; i >= 0; i--) {
        const item = container.list[i];
        if (item.isRankItem) {
            item.destroy();
        }
    }

    const ranks = await getTopRankings(mode);
    const W = scene.scale.width;

    if (ranks.length === 0) {
        const msg = scene.add.text(W/2, 350, 'まだデータがありません', { 
            fontSize: '24px', color: '#aaa', fontStyle: 'bold' 
        }).setOrigin(0.5);
        
        msg.isRankItem = true; // お掃除用の目印
        container.add(msg);
        return;
    }

    ranks.forEach((data, i) => {
        const txt = scene.add.text(W/2, 240 + (i * 40), 
            `${(i + 1).toString().padStart(2, ' ')}. ${data.name.padEnd(10, ' ')} : ${data.time.toFixed(2)}s`, 
            { fontSize: '24px', color: '#fff', fontFamily: 'monospace' }
        ).setOrigin(0.5);
        
        txt.isRankItem = true; // お掃除用の目印
        container.add(txt);
    });
}














// 【本番用】ランキングを保存する関数
async function saveRanking(mode, time) {
    console.log("ランキング送信中...", mode, time);
    try {
        const { db, dbMethods } = window;
        // 「rankings」という本物の倉庫に保存します
        await dbMethods.addDoc(dbMethods.collection(db, "rankings"), {
            name: userName, // 今の名前
            mode: mode,     // たしざん、かけざん等のモード
            time: parseFloat(time), // タイム（数字として保存）
            date: new Date() // 送信した日時
        });
        console.log("ランキング登録完了！");
    } catch (e) {
        console.error("ランキング登録失敗:", e);
    }
}



// 【本番用】ランキングを読み込む関数
async function getTopRankings(mode) {
    console.log(`${mode} のTOP10を取得中...`);
    try {
        const { db, dbMethods } = window;
        // rankingsコレクションから、同じモードのものを、タイムが速い順（昇順）に10件取得
        const q = dbMethods.query(
            dbMethods.collection(db, "rankings"),
            dbMethods.where("mode", "==", mode),
            dbMethods.orderBy("time", "asc"),
            dbMethods.limit(10)
        );

        const querySnapshot = await dbMethods.getDocs(q);
        const ranks = [];
        querySnapshot.forEach((doc) => {
            ranks.push(doc.data());
        });
        return ranks;
    } catch (e) {
        console.error("ランキング取得失敗:", e);
        return [];
    }
}

function createTouchControls(scene) {
    const W = scene.scale.width;
    const H = scene.scale.height;
    
    // ボタンの共通サイズを 75 に設定
    const btnSize = 75;

    const btn = (x, y, txt, start, end, isFire = false) => {
        // 「うつ」ボタンと同じ色・透明度・サイズの設定
        let color = isFire ? 0xff0000 : 0xffffff;
        let alpha = isFire ? 0.4 : 0.2;
        
        let c = scene.add.circle(x, y, btnSize, color, alpha).setInteractive().setScrollFactor(0).setDepth(10000);
        c.on('pointerdown', start);
        c.on('pointerup', end);
        c.on('pointerout', end);
        
        // テキストのサイズもボタンに合わせて調整
        let fontSize = isFire ? '24px' : '45px';
        scene.add.text(x, y, txt, { fontSize: fontSize, fontStyle: 'bold' }).setOrigin(0.5).setScrollFactor(0).setDepth(10001);
    };

    // --- 左上：移動ボタン（サイズアップ） ---
    btn(100, 100, '←', () => moveLeft = true, () => moveLeft = false);
    btn(270, 100, '→', () => moveRight = true, () => moveRight = false);

    // --- 右上：ジャンプと攻撃を縦に並べる ---
    const rightSideX = W - 120;

    // 上段：FIREボタン（既存のサイズ）
    btn(rightSideX, 100, 'うつ', () => { 
        if(!isQuizActive && !isWaitingToStart) shoot(scene); 
    }, () => {}, true);

    // その下：ジャンプボタン（サイズアップ）
    btn(rightSideX, 280, '↑', () => doJump = true, () => doJump = false); 
}






function playSE(scene, type) {
    const ctx = scene.sound.context;
    if (type === 'shoot') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(1200, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.05, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.05);
    } else if (type === 'hit') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(1000, ctx.currentTime);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.08);
    } else if (type === 'destroy') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.15);
    } else if (type === 'quiz_correct') {
        [523.25, 1046.50].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.1));
            gain.gain.setValueAtTime(0.15, ctx.currentTime + (i * 0.1));
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (i * 0.1) + 0.2);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + (i * 0.1)); osc.stop(ctx.currentTime + (i * 0.1) + 0.2);
        });
    } else if (type === 'quiz_wrong') {
        [150, 150].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, ctx.currentTime + (i * 0.15));
            gain.gain.setValueAtTime(0.3, ctx.currentTime + (i * 0.15));
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + (i * 0.15) + 0.1);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(ctx.currentTime + (i * 0.15)); osc.stop(ctx.currentTime + (i * 0.15) + 0.15);
        });
    } else if (type === 'dead') {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'square'; osc.frequency.setValueAtTime(100, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
    }
}

function playClearJingle(scene) {
    const ctx = scene.sound.context;
    const melody = [523.25, 659.25, 783.99, 659.25, 1046.50];
    const timings = [0, 0.15, 0.3, 0.45, 0.6];
    melody.forEach((freq, i) => {
        const osc = ctx.createOscillator(); const gain = ctx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, ctx.currentTime + timings[i]);
        gain.gain.setValueAtTime(0.4, ctx.currentTime + timings[i]);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + timings[i] + 0.2);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + timings[i]); osc.stop(ctx.currentTime + timings[i] + 0.25);
    });
}





function startQuiz(player, ship) {
    if (isQuizActive || isClear || isWaitingToStart) return;
    isQuizActive = true; player.setVelocityX(0);
    const centerX = this.cameras.main.worldView.centerX, centerY = this.cameras.main.worldView.centerY;
    const pW = 500, pH = 400, topY = centerY - (pH / 2);
    const overlay = this.add.rectangle(centerX, centerY, pW, pH, 0x000000, 0.95).setStrokeStyle(4, 0xffffff);
    const title = this.add.text(centerX, topY + 40, 'もんだい', { fontSize: '28px', color: '#ffff00' }).setOrigin(0.5);
    const qText = this.add.text(centerX, topY + 120, '', { fontSize: '50px', color: '#fff' }).setOrigin(0.5);
    const buttons = [];
    for (let i = 0; i < 3; i++) {
        const btnY = topY + 210 + (i * 65);
        // useHandCursor: true を追加
        const btn = this.add.rectangle(centerX, btnY, 200, 45, 0x333333).setInteractive({ useHandCursor: true }).setStrokeStyle(2, 0xffffff);
        const txt = this.add.text(centerX, btnY, '', { fontSize: '28px', color: '#fff' }).setOrigin(0.5);
        btn.txt = txt;

        // --- 演出：マウスが乗ったとき ---
        btn.on('pointerover', () => {
            btn.setStrokeStyle(4, 0xffff00);
            txt.setTint(0xffff00);
        });

        // --- 演出：マウスが外れたとき ---
        btn.on('pointerout', () => {
            btn.setStrokeStyle(2, 0xffffff);
            txt.clearTint();
        });

        // --- 演出：クリックした瞬間 ---
        btn.on('pointerdown', () => {
            btn.y += 4; // 凹む
            txt.y += 4;

            if (btn.val === btn.ans) {
                // 【正解】
                playSE(this, 'quiz_correct');
                btn.setFillStyle(0x00ff00); // 緑色に光る
                
                // 0.1秒だけ待ってからクイズ画面を消す（「押した感」を見せるため）
                this.time.delayedCall(100, () => {
                    [overlay, title, qText, ...buttons, ...buttons.map(b => b.txt)].forEach(obj => obj.destroy());
                    ship.destroy();
                    isQuizActive = false;
                });
            } else {
                // 【不正解】
                playSE(this, 'quiz_wrong');
                btn.setFillStyle(0xff0000); // 赤色に光る
                
                // 少し待ってから次の問題へ（ボタンの位置も戻す）
                this.time.delayedCall(300, () => {
                    btn.y -= 4; // 位置を戻す
                    txt.y -= 4;
                    btn.setFillStyle(0x333333); // 色を戻す
                    generateProblem(qText, buttons);
                });
            }
        });

        buttons.push(btn);
    }
    generateProblem(qText, buttons);
}

function generateProblem(qText, buttons) {
    let n1, n2, ans, sign;

    // --- 1. モード判定と計算式の作成 ---
    if (currentMode === 'addition') {
        // 【たしざん ＆ ひきざん】
        if (Math.random() > 0.5) {
            n1 = Phaser.Math.Between(1, 15);
            n2 = Phaser.Math.Between(1, 14);
            ans = n1 + n2;
            sign = '＋';
        } else {
            n1 = Phaser.Math.Between(10, 20);
            n2 = Phaser.Math.Between(1, n1 - 1);
            ans = n1 - n2;
            sign = '－';
        }
    } 
    else if (currentMode === 'multiplication') {
        // 【かけざん】九九の範囲
        n1 = Phaser.Math.Between(2, 9);
        n2 = Phaser.Math.Between(1, 9);
        ans = n1 * n2;
        sign = '×';
    } 
    else if (currentMode === 'division') {
        // 【わりざん】九九の逆算（必ず割り切れる）
        n2 = Phaser.Math.Between(2, 9);      // わる数
        ans = Phaser.Math.Between(1, 9);     // こたえ
        n1 = n2 * ans;                       // わられる数
        sign = '÷';
    }

    // --- 2. テキストの表示設定 ---
    qText.setText(`${n1} ${sign} ${n2} = ?`);

    // --- 3. 選択肢（ダミーの答え）の作成 ---
    // 答えの近くに数値を散らして、絶妙な難易度にする
    let options = [ans];
    while (options.length < 3) {
        let diff = Phaser.Math.Between(-3, 3);
        let dummy = ans + diff;
        // 答えと同じ、または0以下、またはすでにリストにある数字は避ける
        if (dummy > 0 && !options.includes(dummy)) {
            options.push(dummy);
        }
    }

    // 選択肢をシャッフル
    Phaser.Utils.Array.Shuffle(options);

    // --- 4. ボタンへの反映 ---
    buttons.forEach((btn, i) => {
        btn.val = options[i];
        btn.txt.setText(options[i]);
        btn.ans = ans; // 正解を保存
        btn.setFillStyle(0x333333); // 色を初期化
    });
}

// --- update関数：引数に time を追加 ---
function update(time, delta) {
    if (!isWaitingToStart && !isClear) {
        let elapsed = (this.time.now - startTime) / 1000;
        timerText.setText('タイム: ' + elapsed.toFixed(2) + 's');
    }

    if (isGameOver || isClear || isWaitingToStart) { 
        if (player.body) player.setVelocityX(0); 
        return; 
    }

    distanceText.setText(`ゴールまで あと ${Math.max(0, Math.floor((GOAL_DISTANCE - player.x) / 10))}m`);
    
    if (player.x >= GOAL_DISTANCE) { 
        handleClear(this); 
        return; 
    }

    bg.tilePositionX = this.cameras.main.scrollX * 0.4;
    enemies.getChildren().forEach(e => { 
        if (e.body.velocity.x > 0) e.setFlipX(false); else e.setFlipX(true); 
    });

    // ここで time を使うため、引数に time が必要でした
    if (this.input.activePointer.isDown && time > lastShootTime + 200 && !isQuizActive && this.input.activePointer.x > 300 && this.input.activePointer.x < window.innerWidth - 200) { 
        shoot(this); 
        lastShootTime = time; 
    }

    if (!isQuizActive) { 
        if (keys.A.isDown || moveLeft) { player.setVelocityX(-400); player.setFlipX(true); lastDirection = 'left'; } 
        else if (keys.D.isDown || moveRight) { player.setVelocityX(400); player.setFlipX(false); lastDirection = 'right'; } 
        else { player.setVelocityX(0); } 
    }

    if ((keys.W.isDown || spaceKey.isDown || doJump) && player.body.blocked.down) player.setVelocityY(-800);

    bullets = bullets.filter(b => { 
        if (!b.active) return false; 
        this.physics.overlap(b, enemies, (bullet, enemy) => { 
            let hp = enemy.getData('hp') - 1; enemy.setData('hp', hp); enemy.setTint(0xff0000); 
            if (hp <= 0) { playSE(this, 'destroy'); enemy.destroy(); } else { playSE(this, 'hit'); }
            this.time.delayedCall(100, () => { if(enemy && enemy.active) enemy.clearTint(); }); 
            bullet.active = false; bullet.destroy(); 
        }); return b.active; 
    });
}

// --- handleClear関数：重複を削除 ---
function handleClear(scene) {
    if (isClear) return;
    isClear = true;
    if(bgm) bgm.stop();
    playClearJingle(scene);

    finalTime = (scene.time.now - startTime) / 1000;
    timerText.setText('タイム: ' + finalTime.toFixed(2) + 's');
    // クリア処理のところに追記
    saveRanking(currentMode, finalTime);

    // ベストタイムの更新
    const record = updateBestTime(currentMode, finalTime);

    const W = scene.scale.width;
    const H = scene.scale.height;

    // 背景を暗くする
    scene.add.rectangle(W/2, H/2, W, H, 0x000000, 0.5).setScrollFactor(0).setDepth(25000);

    // ボード
    const board = scene.add.rectangle(W / 2, H / 2, 500, 350, 0x333333, 0.9)
        .setStrokeStyle(4, 0xffffff).setScrollFactor(0).setDepth(26000);

    // --- テキストをカタカナに修正 ---
    scene.add.text(W / 2, H / 2 - 170, 'CASTOR MATH SHOOTER', {
        fontSize: '22px',
        color: '#ffcc00',
        fontStyle: 'bold'
    }).setOrigin(0.5).setScrollFactor(0).setDepth(26001);

    scene.add.text(W / 2, H / 2 - 120, 'クリア！！', { 
        fontSize: '40px', color: '#ffff00', fontStyle: 'bold' 
    }).setOrigin(0.5).setScrollFactor(0).setDepth(26001);

    scene.add.text(W / 2, H / 2 - 40, `タイム: ${finalTime.toFixed(2)}s`, { 
        fontSize: '48px', color: '#ffffff', fontStyle: 'bold' 
    }).setOrigin(0.5).setScrollFactor(0).setDepth(26001);

    // 自己ベストの表示
    const bestColor = record.isNewRecord ? '#00ff00' : '#aaaaaa';
    const bestLabel = record.isNewRecord ? 'しんきろく！ ' : 'ベスト: ';
    scene.add.text(W / 2, H / 2 + 30, `${bestLabel}${record.best.toFixed(2)}s`, { 
        fontSize: '28px', color: bestColor, fontStyle: 'bold' , padding:{top: 10,bottom: 10 }
    }).setOrigin(0.5).setScrollFactor(0).setDepth(26001);

    scene.add.text(W / 2, H / 2 + 100, '5秒後に タイトルへ もどるよ', { 
    fontSize: '20px', 
    color: '#cccccc',
    padding: { top: 10, bottom: 10 } // ★ 上下に余白を作る
    }).setOrigin(0.5).setScrollFactor(0).setDepth(26001);






    
    // --- ランキング表示の仕上げ ---
    // --- ランキング表示のレイアウト修正 ---
    getTopRankings(currentMode).then(ranks => {
        if (ranks.length === 0) return;

        const rankX = W / 2 + 420; // 中央から右にずらす距離を少し広げました
        const rankY = H / 2;

        // ランキング専用の背景ボード（少し暗くして文字を読みやすくする）
        scene.add.rectangle(rankX, rankY, 320, 420, 0x000000, 0.7)
            .setStrokeStyle(2, 0xffcc00)
            .setScrollFactor(0)
            .setDepth(26001);

        // タイトル
        scene.add.text(rankX, rankY - 180, '🏆 全国 TOP 10', { 
            fontSize: '24px', color: '#ffcc00', fontStyle: 'bold' 
        }).setOrigin(0.5).setScrollFactor(0).setDepth(26002);

        // 各順位の表示
        ranks.forEach((data, i) => {
            const shortName = data.name.length > 8 ? data.name.substring(0, 8) + '..' : data.name;
            // 名前とタイムの間を少し空ける
            const rankText = `${(i + 1).toString().padStart(2, ' ')}. ${shortName.padEnd(10, ' ')} ${data.time.toFixed(2)}s`;
            
            scene.add.text(rankX, rankY - 130 + (i * 32), rankText, { 
                fontSize: '18px', 
                color: '#ffffff', 
                fontFamily: 'monospace' // ズレを防ぐため等幅フォントを指定
            }).setOrigin(0.5).setScrollFactor(0).setDepth(26002);
        });
    });







    // プレイヤーの点滅演出
    if (player.body) {
        player.setVelocityX(0);
        player.setTint(0xffffff); 
        scene.tweens.add({
            targets: player,
            alpha: { from: 1, to: 0.2 },
            duration: 150,
            yoyo: true, repeat: -1
        });
    }

    enemies.clear(true, true);
    bombs.clear(true, true);

    scene.time.delayedCall(5000, () => {
        window.location.reload(); 
    });
}





// プレイヤーが死んだ時
function onPlayerHit() {
    if (!isGameOver && !isClear && !isWaitingToStart) {
        isGameOver = true;
        if(bgm) bgm.stop();
        playSE(this, 'dead');
        player.setTint(0xff0000);
        // ここを書き換え：スマホの画面崩れをリセットするためリロードする
        this.time.delayedCall(1000, () => {
            window.location.reload(); 
        });
    }
}



function spawnEnemy(scene) { 
    if (isGameOver || isClear || isWaitingToStart) return; 

    // ★ 画面の高さ(H)を動的に取得
    const H = scene.scale.height;
    const isFromLeft = Math.random() < 0.30; 
    const cam = scene.cameras.main;
    const spawnX = isFromLeft ? cam.scrollX - 150 : cam.scrollX + cam.width + 150; 

    // ★ Hを使って地面の上に配置
    const e = scene.physics.add.sprite(spawnX, H - 100, 'enemy_sprite'); 
    e.setScale(0.22).setOrigin(0.5, 1); 
    e.setData('hp', 4); 
    enemies.add(e); 
    
    scene.physics.add.collider(e, ground); 
    
    e.body.setSize(e.width * 0.4, e.height * 0.6).setOffset((e.width - e.width * 0.4) / 2, e.height - e.height * 0.6); 
    
    if (isFromLeft) { 
        e.body.setVelocityX(100); 
        e.setTint(0xffaa00); 
    } else { 
        e.body.setVelocityX(-50); 
    } 
}



function spawnBomb(scene) { 
    if (isGameOver || isClear || isWaitingToStart) return; 

    // ★ 画面の高さ(H)を動的に取得
    const H = scene.scale.height;
    const cam = scene.cameras.main;
    const spawnX = cam.scrollX + cam.width + 100; 

    // ★ Hを使って地面のすぐ上に配置
    const b = scene.physics.add.sprite(spawnX, H - 40, 'bomb_sprite'); 
    b.setScale(0.08).setOrigin(0.5, 1); 
    bombs.add(b); 
    
    scene.physics.add.collider(b, ground); 
    b.body.setVelocityX(-100); 
}




function scheduleNextSpawn(scene) { scene.time.delayedCall(Phaser.Math.Between(2000, 4500), () => { if (!isGameOver && !isClear && !isWaitingToStart) { spawnEnemy(scene); scheduleNextSpawn(scene); } }); }

// 修正：出現率を下げ、連続出現を禁止
function scheduleNextBombSpawn(scene) { 
    scene.time.delayedCall(1800, () => { // チェック間隔を少し伸ばした
        if (!isGameOver && !isClear && !isWaitingToStart) {
            // 出現率を20%に下げ、かつ「前回が爆弾じゃなかった時」だけ出現チャンス
            if (!lastWasBomb && Math.random() < 0.2) { 
                spawnBomb(scene); 
                lastWasBomb = true; // 今回出したのでフラグを立てる
            } else {
                lastWasBomb = false; // 出さなかったのでフラグを折る（次は出せる）
            }
        }
        scheduleNextBombSpawn(scene); 
    }); 
}


function shoot(scene) { if (isWaitingToStart) return; playSE(scene, 'shoot'); const b = scene.add.rectangle(player.x + (lastDirection === 'right' ? 45 : -45), player.y - 70, 25, 6, 0xffff00); scene.physics.add.existing(b); b.body.setAllowGravity(false); b.body.setVelocityX(lastDirection === 'left' ? -1500 : 1500); b.active = true; bullets.push(b); scene.time.delayedCall(1000, () => { if(b.active) { b.active = false; b.destroy(); } }); }

// タイムを保存・取得する関数
function updateBestTime(mode, newTime) {
    const key = `bestTime_${mode}`;
    const savedTime = localStorage.getItem(key);
    
    // まだ記録がないか、今回のタイムの方が速い（数値が小さい）場合
    if (!savedTime || newTime < parseFloat(savedTime)) {
        localStorage.setItem(key, newTime);
        return { isNewRecord: true, best: newTime };
    }
    return { isNewRecord: false, best: parseFloat(savedTime) };
}
